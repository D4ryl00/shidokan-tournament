# Installation sur un serveur : l'application (image publiée sur Docker Hub) en rôle « serveur » derrière Caddy (HTTPS automatique).
# Procédure : docs/installation-serveur.md
services:
  app:
    image: d4ryl00/shidokan-tournament:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - INSTANCE_ROLE=serveur
      - INSTANCE_NAME=SERVEUR
      - PUBLIC_URL=https://competitions.shidokanfrance.com
      # Envoi des mails avec un compte Google : décommentez et remplissez (voir docs/installation-serveur.md).
      # - GOOGLE_CLIENT_ID=…
      # - GOOGLE_CLIENT_SECRET=…
      - BACKUP_INTERVAL_MIN=30
    # Pas de port publié : seul Caddy y accède.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
