services:
  app:
    build: .
    image: shidokan-tournaments:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - BACKUP_INTERVAL_MIN=${BACKUP_INTERVAL_MIN:-5}
      # Nom de cette installation (par défaut le nom du PC Windows).
      - INSTANCE_NAME=${INSTANCE_NAME:-}
      - COMPUTERNAME=${COMPUTERNAME:-}
    restart: unless-stopped
