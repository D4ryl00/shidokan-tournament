# Version et publication : à chaque push sur main, semantic-release lit les messages de commit (feat, fix…), crée le tag vX.Y.Z
# et la release GitHub ; si une nouvelle version sort, l'image Docker est construite et poussée (workflow docker.yml).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Europe/Paris
      - run: npm run test:perf

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Une release créée avec GITHUB_TOKEN ne déclenche pas d'autre workflow : l'image est construite ici, en appelant docker.yml.
  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
